# H01 explicitly approved advancing project integration/testing; two immutable owner-source
# D0 regression packages ONLY. No product writes, deploy, PG, secrets, provider or grant.
name: "MI04 | Original owner G2 50 + G9 7 exact D0 regression"

on:
  pull_request:
    branches: [integration/product-dev]
    types: [opened, reopened, synchronize]
    paths: [".github/workflows/mi04-owner-g2-g9-exact-d0.yml"]

permissions:
  contents: read

concurrency:
  group: mi04-g2-g9-exact-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CI: "true"
  GIT_TERMINAL_PROMPT: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENAI_API_KEY: ""
  DATABASE_URL: ""
  PROVIDER_API_KEY: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

jobs:
  g2-original-50:
    name: "G2 exact 395 source manifest / original 50 D0"
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/mi04-owner-exact-g2-g9-ci-20261120' &&
      github.event.pull_request.base.ref == 'integration/product-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable original G2 owner source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 9ca667e816dac269084ef8f62051da5fe458eb12
          path: owner-g2
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - name: Pin exact source and runner Git objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C owner-g2 rev-parse HEAD)" = "9ca667e816dac269084ef8f62051da5fe458eb12"
          test "$(git -C owner-g2 rev-parse HEAD:product/SOURCE_MANIFEST.json)" = "15e446e4d14c95d81d1e152efa2e8cb11122b3e3"
          test "$(git -C owner-g2 rev-parse HEAD:candidates/D5-G2/run_regression.py)" = "f7df7e5cc0e6cd8f42e7320d76c55e3b06e8dec5"
          test "$(git -C owner-g2 rev-parse HEAD:product/ai-company-os-backend/tests/test_iam_authority_d5g2.py)" = "16bfc7013ae77cdcf437227b9fb6ac8a9a69d08c"
          echo "G2_OWNER_SOURCE=EXACT"
      - name: Install narrowly pinned existing D0 Ed25519 dependency
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: 'cryptography==46.0.4' 'cffi==2.0.0' 'pycparser==3.0'
          python - <<'PY'
          import cryptography,importlib.metadata as m
          assert cryptography.__version__ == '46.0.4'
          assert m.version('cffi') == '2.0.0'
          assert m.version('pycparser') == '3.0'
          print('G2_PINNED_CRYPTO=PASS')
          PY
      - name: Run original G2 regression runner unchanged (50 cases expected)
        shell: bash
        run: |
          set -euo pipefail
          timeout 420s python -B owner-g2/candidates/D5-G2/run_regression.py "$GITHUB_WORKSPACE/owner-g2" 2>&1 | tee g2-original-50.log
          echo "G2_OWNER_50_PASS_D0_ONLY"
      - name: Scope
        run: |
          echo "CURRENT_CANONICAL_G2_VARIANT=NOT_INTEGRATED"
          echo "TRUE_ISSUER=NOT_IMPLEMENTED; D0_AUTHORITY_ROLLBACK=KNOWN_OPEN"
          echo "PROTECTED_PG=NOT_RUN; INDEPENDENT_SECURITY=HOLD"

  g9-original-7:
    name: "G9 exact 403 source manifest / original G7 7 owner checkout"
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/mi04-owner-exact-g2-g9-ci-20261120' &&
      github.event.pull_request.base.ref == 'integration/product-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable original G9 owner source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 68ec99c673cceadffecf1d192371c10c328caa74
          path: owner-g9
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - name: Pin exact source, original fixture and runner objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C owner-g9 rev-parse HEAD)" = "68ec99c673cceadffecf1d192371c10c328caa74"
          test "$(git -C owner-g9 rev-parse HEAD:product/SOURCE_MANIFEST.json)" = "0555852afa38b7317a53a63db26a79cf151488b9"
          test "$(git -C owner-g9 rev-parse HEAD:candidates/D5-G7/SOURCE_PINS.json)" = "cef9ce82a497522d2e4a9347b77453879e4790f3"
          test "$(git -C owner-g9 rev-parse HEAD:candidates/D5-G7/test_checkout.py)" = "6bd86d7972c8bca511b5702117be3542431e7493"
          test "$(git -C owner-g9 rev-parse HEAD:candidates/D5-G9/run_exact_checkout.py)" = "3e1752ac86e80e23fd646324465dd166d42a5a40"
          echo "G9_OWNER_SOURCE=EXACT"
      - name: Install narrowly pinned existing D0 Ed25519 dependency
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: 'cryptography==46.0.4' 'cffi==2.0.0' 'pycparser==3.0'
          python - <<'PY'
          import cryptography,importlib.metadata as m
          assert cryptography.__version__ == '46.0.4'
          assert m.version('cffi') == '2.0.0'
          assert m.version('pycparser') == '3.0'
          print('G9_PINNED_CRYPTO=PASS')
          PY
      - name: Execute unchanged G9 original seven reader/role/provenance tests
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/g9-owner-exact-$GITHUB_RUN_ID"
          timeout 420s python -B owner-g9/candidates/D5-G9/run_exact_checkout.py --root "$GITHUB_WORKSPACE/owner-g9" --out "$OUT" 2>&1 | tee g9-original-7.log
          cat "$OUT/checkout.log"
          cat "$OUT/report.json"
          echo "G9_OWNER_G7_7_PASS_D0_ONLY"
      - name: Scope
        run: |
          echo "G9_OWNER_READBACK_IS_NOT_PRODUCT_DEV_ACCEPTANCE"
          echo "IAM_ORG_REAL_ISSUER_AND_PROTECTED_PG=HOLD"
          echo "EXTERNAL_SINK=NO; INDEPENDENT_IV=0/8"
