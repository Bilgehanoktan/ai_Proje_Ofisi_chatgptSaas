# User-approved 2026-11-20: ONLY PR #6, existing 10 original Core+OperationsStore D0 SQLite tests.
# No grant, provider, external effects, customer data, deploy, PostgreSQL or merge.
name: "MI-03 | PR6 exact Core + OperationsStore D0 tests"

on:
  pull_request:
    branches:
      - integration/mi03-gate03-org-runtime-closure-01
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/mi03-gate03-pr6-coreops.yml"

permissions:
  contents: read

concurrency:
  group: mi03-pr6-coreops-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CI: "true"
  GIT_TERMINAL_PROMPT: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_NO_INDEX: "1"
  OPENAI_API_KEY: ""
  DATABASE_URL: ""
  PROVIDER_API_KEY: ""

jobs:
  original-core-operationsstore:
    name: "Pinned original Core + OperationsStore 10 SQLite cases (D0 HOLD)"
    if: >-
      github.event.pull_request.number == 6 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/mi03-gate02-core-positive-20261119' &&
      github.event.pull_request.base.ref == 'integration/mi03-gate03-org-runtime-closure-01'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable reviewed source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3b59f54eca5246a4989b203e89bee1f1f1d74e93
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Set up reviewed Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - name: Fail closed on exact original source pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          root=pathlib.Path('candidate')
          want='3b59f54eca5246a4989b203e89bee1f1f1d74e93'
          assert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()==want
          required={
              'product/ai-company-os-backend/tests/test_core_operations_assignment_mi03.py':'23c2f019a27bc9e16d8de3f2af72c239eefac035',
              'product/ai-company-os-backend/app/core/development_review/research_slice.py':'720044a4e4954820b8d298f73b6b75f2189b4f94',
              'product/SOURCE_MANIFEST.json':'92cbdde64d350e28dd02526b655f90b404f267b2',
          }
          for path,sha in required.items():
              assert (root/path).is_file(), ('MISSING_SOURCE',path)
              actual=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD:'+path],text=True).strip()
              assert actual==sha, ('SOURCE_PIN_MISMATCH',path,actual)
          test=root/'product/ai-company-os-backend/tests/test_core_operations_assignment_mi03.py'
          assert hashlib.sha256(test.read_bytes()).hexdigest()=='1ef392356f7f605cff573069d77da31d9188f874636d1179eb7a3751a32e636d'
          assert (root/'product/ai-company-os-backend/tests/test_canonical_research_0224.py').is_file()
          assert (root/'database/0192/candidate_event_outbox_fence.sql').is_file()
          print('EXACT_PINNED_SOURCE=PASS; ORIGINAL_CORE_READER=PASS; TEST_SHA256=PASS')
          PY
      - name: Execute only ten original-source Core / OperationsStore cases
        working-directory: candidate/product/ai-company-os-backend
        shell: bash
        run: |
          set -euo pipefail
          timeout 360s python -B -m unittest discover -s tests -p test_core_operations_assignment_mi03.py -v 2>&1 | tee original-coreops-10.log
          echo "MI03_ORIGINAL_COREOPS_10=PASS_D0_ONLY"
