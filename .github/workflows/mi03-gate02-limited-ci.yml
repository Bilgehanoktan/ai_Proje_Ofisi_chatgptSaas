name: "MI03 GATE02 | Core + OperationsStore D0 PR6"

on:
  pull_request:
    branches: [integration/mi03-gate03-org-runtime-closure-01]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/mi03-gate02-limited-ci.yml"
      - "product/ai-company-os-backend/tests/test_core_operations_assignment_mi03.py"
      - "product/SOURCE_MANIFEST.json"
      - "docs/master-integration/MI03-GATE02-CORE-POSITIVE-20261119/**"

permissions:
  contents: read

concurrency:
  group: g02-pr6-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CI: "true"
  GIT_TERMINAL_PROMPT: "0"
  OPENAI_API_KEY: ""
  DATABASE_URL: ""

jobs:
  original-core-org-d0:
    name: "Exact 553 source pins + original Core and OperationsStore (10 D0)"
    if: >-
      github.event.pull_request.number == 6 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/mi03-gate02-core-positive-20261119' &&
      github.event.pull_request.base.ref == 'integration/mi03-gate03-org-runtime-closure-01' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout complete immutable PR6 commit, no persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: src
          fetch-depth: 1
          persist-credentials: false
      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - name: Check full source manifest, owner Git blobs and original test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C src rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python - <<'PY'
          import ast,hashlib,json,pathlib
          root=pathlib.Path('src/product')
          raw=(root/'SOURCE_MANIFEST.json').read_bytes()
          def blob(x): return hashlib.sha1(b'blob '+str(len(x)).encode()+b'\0'+x).hexdigest()
          assert blob(raw)=='92cbdde64d350e28dd02526b655f90b404f267b2','MANIFEST_BLOB_HOLD'
          files=json.loads(raw)['files']
          assert len(files)==553,'MANIFEST_COUNT_HOLD'
          actual=set()
          for f in root.rglob('*'):
              if f.is_file() and f!=root/'SOURCE_MANIFEST.json':
                  assert not f.is_symlink(),'SYMLINK_HOLD'
                  actual.add(f.relative_to(root).as_posix())
          assert actual==set(files),'MANIFEST_PATH_CLOSURE_HOLD'
          assert len({s.casefold() for s in actual})==553,'CASEFOLD_COLLISION_HOLD'
          for name,meta in files.items():
              rel=pathlib.PurePosixPath(name)
              assert str(rel)==name and '..' not in rel.parts and not rel.is_absolute(),'PATH_HOLD'
              b=(root/name).read_bytes()
              assert len(b)==meta['bytes'] and hashlib.sha256(b).hexdigest()==meta['sha256'],('SOURCE_BYTES_HOLD',name)
          owner={
            'assignment_lifecycle.py':'9f259e89fd339804292eb6c7fa8e7fd177c71b70',
            'assignment_review.sql':'3e887b10263f44b601f6a811a89687b2ee4d864e',
            'durable_ops.py':'619fe224c05d7f7f7efe998583e4730cb2cb4d3e',
            'integration_guard.py':'2cde13e048e0907ef06c104fc5883fe4c1b08271',
            'office_bridge.py':'98b2436dab43cbadf546d8e9e662c12080b83fd2',
            'operations.py':'d6b314a402399fa7e133bccf2e8bb3a39848fead',
            'operations.sql':'3443f6581eb3a8d3894aea0b620f2b8d6dba9b2a',
            'org_core_bridge.py':'78443c1c2270a796dee234be67c8f4b0ab138a54',
            'org_model.py':'cdb33238bf9eaf2a66f1d895ded165cc0065a605',
            'persistence.py':'4124099a497f5bc7fd34756664c7e293055e949e',
            'schema.sql':'32b7609b18e8a53420f17d23f4b53544e7f6f6ad',
            'staffing.py':'e0b9078284922d281996869daa15a455572c1785',
          }
          backend=root/'ai-company-os-backend'
          for file,sha in owner.items():
              assert blob((backend/file).read_bytes())==sha,('OWNER_GIT_BLOB_HOLD',file)
          test=backend/'tests/test_core_operations_assignment_mi03.py'
          b=test.read_bytes()
          assert blob(b)=='23c2f019a27bc9e16d8de3f2af72c239eefac035','ORIGINAL_TEST_BLOB_HOLD'
          methods=[f.name for cls in ast.parse(b).body if isinstance(cls,ast.ClassDef)
                   for f in cls.body if isinstance(f,ast.FunctionDef) and f.name.startswith('test_')]
          assert len(methods)==len(set(methods))==10,'ORIGINAL_METHOD_COUNT_HOLD'
          assert (backend/'tests/test_canonical_research_0224.py').is_file(),'CORE_FIXTURE_HOLD'
          print('MI03_MANIFEST=553/553_PASS; ORG_OWNER_BLOBS=12/12_PASS; G02_ORIGINAL_METHODS=10')
          PY
      - name: Install pinned synthetic-only crypto wheels used by existing CI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: 'cryptography==46.0.4' 'cffi==2.0.0' 'pycparser==2.23'
          python -m pip check
      - name: Run ten original Core and OperationsStore D0 tests (NO PostgreSQL)
        working-directory: src/product/ai-company-os-backend
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_core_operations_assignment_mi03.py' -v 2>&1 | tee "$RUNNER_TEMP/mi03-gate02-unittest.log"
          echo "MI03_G02_ORIGINAL_SQLITE_D0=SEE_LOG; ACTUAL_IAM_ISSUER=HOLD; PG_COMMIT=NOT_RUN; IV=HOLD"
      - name: Preserve synthetic-only raw test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mi03-gate02-pr6-${{ github.run_id }}
          path: ${{ runner.temp }}/mi03-gate02-unittest.log
          if-no-files-found: ignore
          retention-days: 7
