# H01 approved controlled isolation/testing; CI restricted to one exact synthetic D0 test and source commit.
# This checks an existing test, not true independent authority or production effects.
name: "MI04 | 0214 original Memory-Authority-T1 10 D0 cases"

on:
  pull_request:
    branches:
      - integration/mi-common-source-review-01
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/mi04-0214-original-fullchain.yml"

permissions:
  contents: read

concurrency:
  group: mi04-0214-d0-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CI: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  GIT_TERMINAL_PROMPT: "0"
  OPENAI_API_KEY: ""
  DATABASE_URL: ""
  PROVIDER_API_KEY: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

jobs:
  exact-original-0214:
    name: "Exact 553-source pinned D0 Memory Authority T1 original 10"
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/mi04-0214-exact-fullchain-ci-20261120' &&
      github.event.pull_request.base.ref == 'integration/mi-common-source-review-01'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact merged common source (no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: a80932b6d5e99667889dfaa25b682feb267c6cba
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Setup original Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - name: Validate source commit manifest and exact original test blobs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,sqlite3,sys
          root=pathlib.Path('candidate')
          want='a80932b6d5e99667889dfaa25b682feb267c6cba'
          actual=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'], text=True).strip()
          assert actual==want, ('SOURCE_COMMIT_HOLD',actual)
          pins={
            'product/ai-company-os-backend/tests/test_authority_fullchain_0214.py':'4918027e828e8e72273ee4d6a508cac3aa6e9b59',
            'product/ai-company-os-backend/tests/test_transition_mapping_0194.py':'a4a3827ec4267ce275efe52fe5488e1868502c3f',
            'product/ai-company-os-backend/app/core/transaction/intent_authority.py':'fa47acd32adb309896f762ec50e47bf26641adbb',
            'product/ai-company-os-backend/requirements-history-signatures.txt':'b704e3dfd92b43d966dd4c023dab1ab576f57141',
          }
          for path,blob in pins.items():
            actual=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD:'+path],text=True).strip()
            assert actual==blob, ('ORIGINAL_BLOB_HOLD',path,actual)
          manifest=json.loads((root/'product/SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          assert len(manifest['files'])==552, ('MANIFEST_SIZE_HOLD',len(manifest['files']))
          for name,pin in manifest['files'].items():
            file=root/'product'/name
            assert file.is_file() and not file.is_symlink(), ('FILE_MISSING_HOLD',name)
            raw=file.read_bytes()
            assert len(raw)==pin['bytes'], ('BYTES_HOLD',name)
            assert hashlib.sha256(raw).hexdigest()==pin['sha256'], ('SHA256_HOLD',name)
          assert sqlite3.sqlite_version_info >= (3,37), sqlite3.sqlite_version
          print('MI04_0214_EXACT_PRODUCT_MANIFEST=552/552_PASS')
          print(f'PYTHON={sys.version.split()[0]}; SQLITE={sqlite3.sqlite_version}')
          PY
      - name: Install only original reviewed D0 cryptographic dependency versions
        working-directory: candidate/product/ai-company-os-backend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ../.. rev-parse HEAD:product/ai-company-os-backend/requirements-history-signatures.txt)" = "b704e3dfd92b43d966dd4c023dab1ab576f57141"
          grep -qx 'cryptography==46.0.4' requirements-history-signatures.txt
          timeout 150s python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-history-signatures.txt 'cffi==2.0.0' 'pycparser==3.0'
          python - <<'PY'
          import cryptography, importlib.metadata as m
          assert cryptography.__version__=='46.0.4'
          assert m.version('cffi')=='2.0.0'
          assert m.version('pycparser')=='3.0'
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          assert len(Ed25519PrivateKey.generate().public_key().public_bytes_raw())==32
          print('MI04_0214_REVIEWED_D0_DEPENDENCIES=PASS')
          PY
      - name: Run ten exact existing fullchain 0214 tests on disposable D0 stores
        working-directory: candidate/product/ai-company-os-backend
        shell: bash
        run: |
          set -euo pipefail
          timeout 480s python -B -m unittest discover -s tests -p test_authority_fullchain_0214.py -v 2>&1 | tee original-0214-10.log
          echo 'MI04_ORIGINAL_0214_10=PASS_D0_ONLY'
      - name: State known replay residual and all missing security gates
        shell: bash
        run: |
          echo 'D0_FULL_RESTORE_REPLAY_RESIDUAL=REPRODUCED_NOT_SECURITY_PASS'
          echo 'REAL_INDEPENDENT_ISSUER_ROOT_CLAIM_SINK=NOT_IMPLEMENTED'
          echo 'G2_50=NOT_RUN; G9_7=NOT_RUN; STRICT_POSTGRESQL=NOT_RUN'
          echo 'W8_FULL_BUILD=NOT_RUN; INDEPENDENT_NEGATIVE=0/8; PROD=HOLD'
          echo 'PRODUCT_DEV_AND_MAIN=UNCHANGED; NO_PROVIDER_OR_EXTERNAL_EFFECTS'
